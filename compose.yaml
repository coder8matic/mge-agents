name: mge-agents

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mge
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mge -d mge"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  executor:
    image: ghcr.io/rhyssullivan/executor-selfhost:${EXECUTOR_VERSION:-latest}
    ports:
      - "127.0.0.1:4788:4788"          # web UI on localhost only
    volumes:
      - executor-data:/data             # SQLite + encryption keys -> BACK UP!
    environment:
      EXECUTOR_WEB_BASE_URL: http://localhost:4788
    restart: unless-stopped

  odoo-mcp:
    build: ./services/odoo-mcp
    environment:
      ODOO_URL: ${ODOO_URL}
      ODOO_DB: ${ODOO_DB}
      ODOO_AGENT_API_KEY: ${ODOO_AGENT_API_KEY}   # agent key only
    expose:
      - "8000"
    restart: unless-stopped

  controller:
    build: ./services/controller
    depends_on:
      postgres:
        condition: service_healthy
      executor:
        condition: service_started
    environment:
      TZ: Europe/Ljubljana
      DATABASE_URL: postgresql://mge:${POSTGRES_PASSWORD}@postgres:5432/mge
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}   # subscription, not an API key
      EXECUTOR_MCP_URL: http://executor:4788/mcp
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DISCORD_APPROVAL_CHANNEL_ID: ${DISCORD_APPROVAL_CHANNEL_ID}
      DISCORD_APPROVER_IDS: ${DISCORD_APPROVER_IDS}
      ODOO_URL: ${ODOO_URL}
      ODOO_DB: ${ODOO_DB}
      ODOO_APPROVER_API_KEY: ${ODOO_APPROVER_API_KEY}  # approver key only
      ODOO_AGENT_USER_ID: ${ODOO_AGENT_USER_ID}
    volumes:
      - ./agents:/agents:ro
      - ./logs:/logs
    restart: unless-stopped

volumes:
  pgdata:
  executor-data:
