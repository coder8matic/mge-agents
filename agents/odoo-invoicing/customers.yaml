# Monthly invoicing: source of truth for the agent.
# Customer and product names must match Odoo EXACTLY.
# The agent replaces {period} with the month and year (e.g. "oktober 2026").
# Product names and descriptions are customer-facing invoice text, so they stay in Slovenian.

customers:
  - partner: "Primer d.o.o."
    items:
      - product: "Mesečno vzdrževanje"
        quantity: 1
        price_unit: 450.00
        description: "Vzdrževanje sistema za {period}"

  - partner: "Druga stranka d.o.o."
    items:
      - product: "Svetovanje"
        quantity: 8
        price_unit: 75.00
        description: "Svetovalne ure za {period}"
